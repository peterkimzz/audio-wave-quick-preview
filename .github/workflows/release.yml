name: Release macOS App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Must match the runner in ci.yml, so the binary users download is built on
    # the toolchain CI actually tested against.
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build app bundle and release archive
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: ./scripts/package-app.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/AudioWaveQuickPreview-${{ github.ref_name }}-macos.zip
