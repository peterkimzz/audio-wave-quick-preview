name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs alongside `test` rather than gating it: this finishes in seconds while
  # `test` takes minutes, so a formatting slip surfaces without waiting on a build.
  lint:
    # Must match the runner in the test job below.
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # `--strict` is load-bearing: without it `swift format lint` exits 0 even
      # when it reports violations, which silently disables this gate.
      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests

      - name: Run SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict

  test:
    # Pinned deliberately rather than `macos-latest`: that label moves to the next
    # OS release without notice, which swaps the Xcode/Swift toolchain underneath
    # and breaks CI with no code change (see 0ce46fb). Bump this on purpose.
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: swift test

      # Viewport, pyramid, and keyboard coverage lives only in this executable,
      # not in the `swift test` target.
      - name: Run specs
        run: swift run AudioWaveQuickPreviewSpecs

      # Runs the same script release.yml does, so the release-configuration
      # build and the bundle assembly are verified before a tag exists rather
      # than after. VERSION_NAME defaults to `dev`, so no tag is needed.
      - name: Build release app bundle
        run: ./scripts/package-app.sh
